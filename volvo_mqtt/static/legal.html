<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} - Vehicle Bridge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%231d4a6e' stroke-width='2.6'%3E%3Cpath d='M5 20v-4.5l3-6.5h16l3 6.5V20H5z'/%3E%3Ccircle cx='10' cy='22.5' r='2.5'/%3E%3Ccircle cx='22' cy='22.5' r='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f1ec; --surface: #fbfaf7; --surface-2: #eeebe4; --ink: #15181b; --muted: #6b6f73;
  --line: #dedad1; --accent: #1d4a6e; --accent-ink: #ffffff;
  --shadow: 0 1px 2px rgba(20,20,20,.04), 0 8px 24px -12px rgba(20,20,20,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1012; --surface: #16191c; --surface-2: #1d2125; --ink: #ecebe7; --muted: #959a9f;
    --line: #272c31; --accent: #7fb2dd; --accent-ink: #0e1012;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --bg: #0e1012; --surface: #16191c; --surface-2: #1d2125; --ink: #ecebe7; --muted: #959a9f;
  --line: #272c31; --accent: #7fb2dd; --accent-ink: #0e1012;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.7 "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 24px; }
nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.brand svg { width: 32px; height: 32px; color: var(--accent); }
.brand span { font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 17px; }
.btn { text-decoration: none; font-weight: 700; font-size: 15px; padding: 11px 20px; border-radius: 12px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.layout { display: grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: start; margin-top: 36px; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; gap: 20px; } .toc { position: static !important; } }
.toc { position: sticky; top: 24px; font-size: 14px; }
.toc a { display: block; padding: 6px 12px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 600; }
.toc a:hover { background: var(--surface); color: var(--ink); }
.toc a.on { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
article { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  padding: 40px clamp(22px, 5vw, 56px); min-width: 0; }
h1 { font-size: clamp(30px, 5vw, 42px); letter-spacing: -.03em; line-height: 1.1; margin: 0 0 8px; }
.meta { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
h2 { font-size: 19px; letter-spacing: -.01em; margin: 34px 0 8px; }
p, li { color: var(--ink); }
ul { padding-left: 22px; }
li { margin: 4px 0; }
.note { background: var(--surface-2); border-radius: 14px; padding: 14px 18px; font-size: 14.5px; color: var(--muted); }
a { color: var(--accent); }
footer { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
footer a { color: var(--muted); }
@media (max-width: 560px) { .wrap { padding: 20px 16px; } article { padding: 28px 20px; } }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-4.5l3-6.5h16l3 6.5V20a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M5 15.5h22"/><circle cx="10" cy="22.5" r="2.5"/><circle cx="22" cy="22.5" r="2.5"/></svg>
      <span>Vehicle Bridge</span>
    </a>
    <a class="btn" href="/login">Log in</a>
  </nav>
  <div class="layout">
    <aside class="toc">
      <a href="/terms" class="{{terms_on}}">Terms and Conditions</a>
      <a href="/privacy" class="{{privacy_on}}">Privacy Notice</a>
      <a href="/">Home</a>
    </aside>
    <article>
      <h1>{{title}}</h1>
      <p class="meta">Last updated {{updated}}</p>
      {{body}}
    </article>
  </div>
  <footer><span>Vehicle Bridge is an independent project and is not affiliated with or endorsed by Volvo Cars.</span><span><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></span></footer>
</div>
<script>
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</body>
</html>
